# gitleaks 設定ファイル
# 参考: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
#
# gitleaks のデフォルトルールセットを継承しつつ、本リポジトリ固有の
# false positive を allowlist で除外する。

[extend]
useDefault = true

[allowlist]
description = "VTuberSystemBase 固有の false positive 除外"

# RFC 6455 §4.2.2 の WebSocket ハンドシェイク例ベクタのみをピンポイントで除外する。
#   - dGhlIHNhbXBsZSBub25jZQ==      ("the sample nonce" を Base64 化したサンプル文字列)
#   - s3pPLMBiTxaQ9kYGzzhZRbK+xOo=  (上記から算出される Sec-WebSocket-Accept 期待値)
# これらは IETF が公開する標準テストベクタであり、実在する秘密情報ではない。
#
# 注意: パス単位の除外 (paths = [...]) は採用しない。ファイル全体を allowlist 化すると
# 将来そのファイルへ実機密情報が混入した際に検知漏れする恐れがあるため、
# 「確認済みトークン値そのもの」だけを regexes でホワイトリスト化する方式を取る。
regexes = [
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  '''s3pPLMBiTxaQ9kYGzzhZRbK\+xOo=''',
]
